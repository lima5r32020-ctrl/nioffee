<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Online</title>
    <style>
        :root {
            --azul-claro: #4da6ff;
            --azul-escuro: #0066cc;
            --cinza-claro: #f4f6f9; /* Fundo geral da página */
            --cinza-logo: #eeeeee;  /* Tom de cinza para o fundo da logo (mais suave) */
            --texto: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cinza-claro);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--cinza-logo);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo-wrapper {
            display: inline-block;
            background-color: var(--cinza-logo);
            padding: 10px;
            border-radius: 8px;
        }

        .logo {
            max-width: 180px;
            height: auto;
            display: block;
            background-color: var(--cinza-logo);
            mix-blend-mode: multiply; /* Mantém a integração com o fundo */
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .card h2 {
            color: var(--azul-escuro);
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            background-color: var(--azul-claro);
            transition: background-color 0.3s, transform 0.1s;
            letter-spacing: 0.5px;
            border: none;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--azul-escuro);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        footer {
            background-color: var(--azul-escuro);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-wrapper">
            <img 
                src="https://matoleitao.rs.gov.br/wp-content/uploads/2026/01/cpfl.jpg" 
                alt="Logo" 
                class="logo"
            >
        </div>
    </header>

    <main>
        <div class="card">
            <h2>Escolha uma opção</h2>
            <div class="btn-group">
                <a href="https://wa.me/5581984669626?text=Olá!%20Gostaria%20de%20emitir%20a%202ª%20via%20da%20minha%20conta." 
                   target="_blank" class="btn">Emitir 2ª via da conta</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Gostaria%20de%20pagar%20minha%20fatura." 
                   target="_blank" class="btn">Pagar fatura</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Quero%20negociar%20minhas%20dívidas." 
                   target="_blank" class="btn">Negociação de dívidas</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Preciso%20falar%20com%20um%20atendente." 
                   target="_blank" class="btn">
                   <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
                       <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>

                   Falar com atendente
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Todos os direitos reservados.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPFL-RGE - Atendimento Online</title>
    <style>
        :root {
            --verde: #00A859;
            --azul: #003399;
            --laranja: #FF6B00;
            --cinza-claro: #f4f6f9;
            --texto: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cinza-claro);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 10px;
        }

        header h1 {
            color: var(--azul);
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--verde);
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .card h2 {
            color: var(--azul);
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: background-color 0.3s, transform 0.1s;
            letter-spacing: 0.5px;
            border: none;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-verde {
            background-color: var(--verde);
        }
        .btn-verde:hover {
            background-color: #008c4a;
        }

        .btn-azul {
            background-color: var(--azul);
        }
        .btn-azul:hover {
            background-color: #002266;
        }

        .btn-laranja {
            background-color: var(--laranja);
        }
        .btn-laranja:hover {
            background-color: #cc5500;
        }

        footer {
            background-color: var(--azul);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <img 
            src="https://matoleitao.rs.gov.br/wp-content/uploads/2026/01/cpfl.jpg" 
            alt="CPFL-RGE" 
            class="logo"
        >
        <h1>CPFL-RGE</h1>
        <p>Atendimento Online</p>
    </header>

    <main>
        <div class="card">
            <h2>Escolha uma opção</h2>
            <div class="btn-group">
                <a href="https://wa.me/5581984669626?text=Olá!%20Gostaria%20de%20solicitar%20a%202ª%20via%20da%20minha%20fatura." 
                   target="_blank" class="btn btn-verde">2ª Via</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Quero%20aderir%20à%20fatura%20digital." 
                   target="_blank" class="btn btn-azul">Fatura Digital</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Quero%20negociar%20minhas%20dívidas." 
                   target="_blank" class="btn btn-laranja">Negociação de Dívidas</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Preciso%20falar%20com%20um%20atendente." 
                   target="_blank" class="btn btn-verde">Fala com Atendente</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Vim%20pelo%20site%20da%20CPFL-RGE." 
                   target="_blank" class="btn btn-azul">Falar no WhatsApp</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CPFL-RGE. Todos os direitos reservados.</p>
    </footer>
</body>
</html>

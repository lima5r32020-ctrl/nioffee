<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Online</title>
    <style>
        :root {
            --azul-claro: #4da6ff;
            --azul-escuro: #0066cc;
            --cinza-claro: #f4f6f9;
            --texto: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--cinza-claro);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #ffffff;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo-wrapper {
            display: inline-block;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 8px;
        }

        .logo {
            max-width: 180px;
            height: auto;
            display: block;
            background-color: #ffffff;
            mix-blend-mode: multiply;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .card h2 {
            color: var(--azul-escuro);
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            background-color: var(--azul-claro);
            transition: background-color 0.3s, transform 0.1s;
            letter-spacing: 0.5px;
            border: none;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--azul-escuro);
        }

        .btn:active {
            transform: scale(0.98);
        }

        footer {
            background-color: var(--azul-escuro);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-wrapper">
            <img 
                src="https://matoleitao.rs.gov.br/wp-content/uploads/2026/01/cpfl.jpg" 
                alt="Logo" 
                class="logo"
            >
        </div>
    </header>

    <main>
        <div class="card">
            <h2>Escolha uma opção</h2>
            <div class="btn-group">
                <a href="https://wa.me/5581984669626?text=Olá!%20Gostaria%20de%20emitir%20a%202ª%20via%20da%20minha%20conta." 
                   target="_blank" class="btn">Emitir 2ª via da conta</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Gostaria%20de%20pagar%20minha%20fatura." 
                   target="_blank" class="btn">Pagar fatura</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Quero%20negociar%20minhas%20dívidas." 
                   target="_blank" class="btn">Negociação de dívidas</a>
                <a href="https://wa.me/5581984669626?text=Olá!%20Preciso%20falar%20com%20um%20atendente." 
                   target="_blank" class="btn">Falar com atendente</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Todos os direitos reservados.</p>
    </footer>
</body>
</html>
